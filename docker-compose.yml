version: '3.9'

services:
  api:
    build: ./api
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - api_db:/app/db
    environment:
      - RAILS_ENV=development
      - CORS_ORIGINS=http://localhost:3000
      - RAILS_LOG_TO_STDOUT=true
      - SECRET_KEY_BASE=development_secret_key_not_for_production
    command: >
      sh -c "bundle exec rails db:create db:migrate &&
             bundle exec rails server -b 0.0.0.0 -p 3001"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api

volumes:
  api_db:
